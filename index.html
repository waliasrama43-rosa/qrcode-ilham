<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timemark - Image Processing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container-main {
            max-width: 1200px;
            margin: 0 auto;
        }

        .canvas-wrapper {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 20px;
            margin-bottom: 30px;
        }

        canvas {
            width: 100%;
            height: auto;
            border-radius: 8px;
            background: #f0f0f0;
            max-height: 600px;
            object-fit: contain;
            display: block;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .control-panel {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .control-panel h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #1f2937;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }

        .button-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            flex-direction: column;
        }

        button {
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #1f2937;
        }

        .btn-secondary:hover {
            background: #d1d5db;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 12px;
            width: 100%;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: block;
        }

        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            display: block;
            padding: 16px 20px;
            background: #f3f4f6;
            border: 2px dashed #d1d5db;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            color: #6b7280;
        }

        .file-input-label:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .info-box {
            background: #f0f9ff;
            border-left: 4px solid #0284c7;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 13px;
            color: #0c4a6e;
            margin-bottom: 16px;
        }

        .success-message {
            background: #dcfce7;
            border: 1px solid #86efac;
            color: #166534;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 16px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .two-column {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        @media (max-width: 640px) {
            .two-column {
                grid-template-columns: 1fr;
            }
            
            .controls-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container-main">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-white mb-2">⏱️ Timemark</h1>
            <p class="text-white text-opacity-90">Professional Image Metadata Overlay System</p>
        </div>

        <!-- Canvas Display Section -->
        <div class="canvas-wrapper">
            <canvas id="canvas" width="1280" height="720"></canvas>
        </div>

        <!-- Controls Grid Section -->
        <div class="controls-grid">
            <!-- 1. Upload Image Panel -->
            <div class="control-panel">
                <h3>📸 Upload Image</h3>
                <div class="info-box">
                    Select a photo to start processing. Recommended: 1280x720px or larger.
                </div>
                <div class="file-input-wrapper">
                    <input type="file" id="imageInput" accept="image/*">
                    <label for="imageInput" class="file-input-label">
                        <div>📤 Click to upload or drag & drop</div>
                        <div style="font-size: 12px; margin-top: 4px;">PNG, JPG, GIF up to 10MB</div>
                    </label>
                </div>
                <div id="successMessage" class="success-message"></div>
            </div>

            <!-- 2. Datetime Panel -->
            <div class="control-panel">
                <h3>🕐 Datetime & Location</h3>
                <div class="form-group">
                    <label>Time (HH:MM)</label>
                    <input type="text" id="timeInput" placeholder="11:47">
                </div>
                <div class="two-column">
                    <div class="form-group">
                        <label>Date (DD)</label>
                        <input type="text" id="dateInput" placeholder="01">
                    </div>
                    <div class="form-group">
                        <label>Month (Full)</label>
                        <input type="text" id="monthInput" placeholder="Mei">
                    </div>
                </div>
                <div class="form-group">
                    <label>Year</label>
                    <input type="text" id="yearInput" placeholder="2026">
                </div>
                <div class="form-group">
                    <label>Day Name</label>
                    <input type="text" id="dayInput" placeholder="Jumat">
                </div>
            </div>

            <!-- 3. Location Panel -->
            <div class="control-panel">
                <h3>📍 Location Details</h3>
                <div class="form-group">
                    <label>Full Address</label>
                    <textarea id="addressInput" placeholder="Suruh, Kedungbako, Kec. Rejoso..."></textarea>
                </div>
                <div class="two-column">
                    <div class="form-group">
                        <label>Latitude (°S)</label>
                        <input type="text" id="latitudeInput" placeholder="7.671275">
                    </div>
                    <div class="form-group">
                        <label>Longitude (°E)</label>
                        <input type="text" id="longitudeInput" placeholder="112.939807">
                    </div>
                </div>
            </div>

            <!-- 4. Activity & Branding Panel -->
            <div class="control-panel">
                <h3>🏷️ Activity & Branding</h3>
                <div class="form-group">
                    <label>Activity Title</label>
                    <input type="text" id="titleInput" placeholder="SRT 48 PASURUAN">
                </div>
                <div class="form-group">
                    <label>Verification Code</label>
                    <input type="text" id="codeInput" placeholder="BKCH3MB3X94EWG">
                </div>
                <button class="btn-secondary btn-small" onclick="generateVerificationCode()">
                    🔄 Generate Random Code
                </button>
            </div>

            <!-- 5. Actions Panel -->
            <div class="control-panel">
                <h3>⚙️ Actions</h3>
                <div class="button-group">
                    <button class="btn-primary" onclick="applyOverlay()">
                        ✨ Apply & Preview
                    </button>
                    <button class="btn-secondary" onclick="exportCanvas()">
                        💾 Export as JPEG
                    </button>
                    <button class="btn-secondary" onclick="resetForm()">
                        🔄 Reset All
                    </button>
                </div>
            </div>

            <!-- 6. Settings Panel -->
            <div class="control-panel">
                <h3>ℹ️ Quick Settings</h3>
                <div class="form-group">
                    <label style="display: flex; align-items: center; cursor: pointer;">
                        <input type="checkbox" id="autoFillToggle" checked style="margin-right: 8px; cursor: pointer;"> 
                        Auto-fill current date/time
                    </label>
                </div>
                <div class="form-group">
                    <label>Overlay Opacity</label>
                    <input type="range" id="opacitySlider" min="0.3" max="0.9" step="0.1" value="0.6" style="width: 100%; cursor: pointer;">
                    <div style="font-size: 12px; color: #6b7280; margin-top: 6px;">
                        Current: <span id="opacityValue">60%</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===================================== -->

</body>
</html>
